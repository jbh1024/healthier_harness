# detekt 프로젝트 설정 — 기본 규칙(buildUponDefaultConfig) 위에 덮어쓰는 항목만 기술

style:
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 4
  # 미구현 기능(Passkey 검증, FCM 발송 등)의 TODO 마커는 의도된 추적 수단
  ForbiddenComment:
    active: false
  # HTTP 상태/토큰 만료 등 도메인 수치가 많아 노이즈 대비 실익 낮음
  MagicNumber:
    active: false
  # @PathVariable은 라우팅 매핑상 필수 — 시그니처에서 제거 불가
  UnusedParameter:
    ignoreAnnotated: ['PathVariable']
  UnusedPrivateProperty:
    active: true
  # 가드 절 스타일 검증(신청 자격, 권한, 정원 등)은 throw가 자연스럽게 많음
  ThrowsCount:
    max: 6

complexity:
  LongParameterList:
    # JPA 엔티티(기본값 다수)와 Service 생성자 주입은 파라미터가 많아질 수 있음
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
  TooManyFunctions:
    thresholdInClasses: 20
    thresholdInFiles: 20

performance:
  # Spring Boot 진입점 runApplication(*args) 관용구 1건뿐 — 규칙 실익 없음
  SpreadOperator:
    active: false

exceptions:
  # GlobalExceptionHandler의 최종 Exception 캐치는 의도된 설계
  TooGenericExceptionCaught:
    active: false
